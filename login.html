<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Iniciar sesión · Odontología Integral</title>
<link rel="stylesheet" href="css/login.css" />
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo">🦷</div>
      <h1>Odontología Integral</h1>
      <p class="login-subtitle">Sistema de gestión clínica</p>
    </div>

    <form id="loginForm" class="login-form" novalidate>
      <div id="loginError" class="alert alert-error hidden"></div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="correo@consultorio.com" required autocomplete="username" />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="password-field">
          <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
          <button type="button" id="togglePassword" class="toggle-password" aria-label="Mostrar contraseña">👁</button>
        </div>
      </div>

      <button type="submit" id="loginSubmitBtn" class="btn btn-primary btn-block">Iniciar sesión</button>
    </form>

    <p class="login-footer">Acceso exclusivo para el personal del consultorio.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
